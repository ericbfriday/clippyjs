approvedGitRepositories:
  - "**"

enableScripts: true

initScope: "@clippyjs"

nmHoistingLimits: workspaces

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux
    - win32

yarnPath: .yarn/releases/yarn-4.18.1.cjs
